version: '3.8'

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change_me}
      MYSQL_DATABASE: ${DB_NAME:-nexus_crm}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-change_me}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "3306:3306" # remove/comment out in production if MySQL shouldn't be reachable from outside the host

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-change_me}
      DB_NAME: ${DB_NAME:-nexus_crm}
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_string}
      JWT_EXPIRES_IN: 7d
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@yourcompany.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change_me}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      SHEET_AUTO_SYNC: "true"
      SHEET_SYNC_INTERVAL_MINUTES: 5
      NOTIFICATIONS_CHECK_INTERVAL_MINUTES: 60
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      SAMPLE_DATA_FALLBACK: ${SAMPLE_DATA_FALLBACK:-true}
      # Optional — leave blank to keep these features off
      POWERBI_TENANT_ID: ${POWERBI_TENANT_ID:-}
      POWERBI_CLIENT_ID: ${POWERBI_CLIENT_ID:-}
      POWERBI_CLIENT_SECRET: ${POWERBI_CLIENT_SECRET:-}
      POWERBI_WORKSPACE_ID: ${POWERBI_WORKSPACE_ID:-}
      POWERBI_REPORT_ID: ${POWERBI_REPORT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      REPORTS_AUTO_EMAIL: ${REPORTS_AUTO_EMAIL:-false}
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5000/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
